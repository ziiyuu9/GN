<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>咕奈 GoodNight</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      width: min(100%, 1024px);
      padding: 2rem;
      text-align: center;
    }
    .subtitle {
      margin-top: 0.75rem;
      color: #cbd5e1;
      font-size: 1.1rem;
      max-width: 42rem;
      margin-left: auto;
      margin-right: auto;
    }
    .card-grid {
      display: grid;
      gap: 1.5rem;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      margin-top: 2rem;
    }
    .card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 1rem;
      padding: 1.5rem;
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 60px rgba(15, 23, 42, 0.35);
      text-align: left;
    }
    .card h2 {
      margin: 0 0 0.75rem;
      font-size: 1.4rem;
    }
    .card p {
      margin: 0 0 1.25rem;
      color: #cbd5e1;
      line-height: 1.65;
    }
    .component-placeholder {
      padding: 1rem;
      border: 1px dashed rgba(148, 163, 184, 0.44);
      border-radius: 0.75rem;
      color: #e2e8f0;
      background: rgba(148, 163, 184, 0.05);
    }
  </style>
</head>
<body>
  <main class="container">
    <section>
      <h1>咕奈 GoodNight</h1>
      <p class="subtitle">私人化 AI 床邊故事與語音陪伴系統，支援本地 Ollama 與 TTS 服務。</p>
    </section>

    <div class="card-grid">
      <article class="card">
        <h2>生成床邊故事</h2>
        <p>整合本地 Ollama；用最少延遲生成適合睡前閱讀的沉浸式故事。</p>
        <div class="component-placeholder">StoryGenerator 元件在這裡呈現。</div>
      </article>

      <article class="card">
        <h2>克隆語音合成</h2>
        <p>上傳聲音樣本並生成自訂朗讀語音，為故事增添專屬陪伴效果。</p>
        <div class="component-placeholder">VoiceSynthesizer 元件在這裡呈現。</div>
      </article>
    </div>
  </main>
</body>
</html>
