name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: |
          cd source
          npm ci

      - name: Run lint
        run: |
          cd source
          npm run lint

      - name: Run unit tests
        run: |
          cd source
          npm test

      - name: Build Next.js app
        run: |
          cd source
          npm run build

      - name: Run Playwright tests (optional)
        if: ${{ always() }}
        run: |
          cd source
          npx playwright test --config=playwright.config.ts --reporter=dot || true
